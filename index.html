<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        var t = localStorage.getItem("odin-theme");
        if (t !== "light" && t !== "dark") {
          localStorage.setItem("odin-theme", "dark");
          t = "dark";
        }
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
      })();
    </script>
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
      }
      html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #root {
        background-color: #0d0d18;
        color: #f4f5f7;
      }
      html[data-theme="light"], html[data-theme="light"] body, html[data-theme="light"] #root {
        background-color: #f0f2f5;
        color: #1a1a2e;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ODIN ERP CLUB</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
